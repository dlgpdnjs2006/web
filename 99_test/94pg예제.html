<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>94페이지</title>
  <style>
    div{
      width: 400px;
      border: 1px solid #ccc;
      padding: 20px;
    }
    /* h2{
      text-align: center;
    } */
    table, th, td{
      margin: auto;
      border: 1px solid #ccc;
      border-collapse: collapse;
    }
    th,td{
      padding: 10px;
    }
  </style>
</head>

<body>
  <div>
    <h2>상품구성</h2>
    <table>
      <caption>선물용과 가정용 상품 구성</caption>
      <tr>
        <th>용도</th>
        <th>중량</th>
        <th>개수</th>
        <th>가격</th>
      </tr>
      <tr>
        <td>선물용</td>
        <td>3kg</td>
        <td>11~16과</td>
        <td>35,000원</td>
      </tr>
      <tr>
        <td>선물용</td>
        <td>5kg</td>
        <td>18과~26과</td>
        <td>25,000원</td>
      </tr>
      <tr>
        <td>가정용</td>
        <td>3kg</td>
        <td>11과~16과</td>
        <td>30,000원</td>
      </tr>
      <tr>
        <td>가정용</td>
        <td>5kg</td>
        <td>18과~26과</td>
        <td>47,000원</td>
      </tr>
    </table>
  </div>
</body>

</html>

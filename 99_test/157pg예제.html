<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>157pg예제</title>
  <style>
    form {
      width: 500px;
      border: 1px solid #ccc;
      padding: 10px 15px;
    }
  </style>
</head>

<body>
  <form>
    <h2>회원 가입을 환영합니다</h2>
    <fieldset>
      <legend>사용자 정보</legend>
      <ul>
        <li>
          <label for="name">아이디</label>
          <input type="text" id="name" placeholder="4자~10자 사이, 공백 없이">
        </li>
        <li>
          <label for="mail">이메일</label>
          <input type="email" id="mail" required>
        </li>
        <li>
          <label for="pw">비밀번호</label>
          <input type="password" id="pw" placeholder="문자와 숫자,특수 기호 포함">
        </li>
        <li>
          <label for="pw1">비밀번호 확인</label>
          <input type="password" id="pw1">
        </li>
      </ul>
    </fieldset>
    <fieldset>
      <legend>이벤트와 새로운 소식</legend>
      <label for="p1"><input type="radio" id="p1">메일 수신</label>
      <label for="p2"><input type="radio" id="p2">메일 수신 안 함</label>
    </fieldset>
    <div>
      <input type="submit" value="가입하기">
      <input type="reset" value="취소">
    </div>
  </form>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100페이지</title>
  <style>
    div {
      width: 400px;
      border: 1px solid #ccc;
      padding: 20px;
    }

    /* h2{
      text-align: center;
    } */
    table,
    th,
    td {
      margin: auto;
      border: 1px solid #ddd;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
    }
  </style>
</head>

<body>
  <div>
    <h2>상품구성</h2>
    <table>
      <caption>선물용과 가정용 상품 구성</caption>
      <!--
        <col>태그는 세로(열)을 1개를 지정할수 있음
        <colgroup>는 <col>태그 2개 이상 지정할때 사용
      -->
      <colgroup>
        <col style="background-color: #ccc;"><!--색 지정-->
      </colgroup>
      <tr>
        <th>용도</th>
        <th>중량</th>
        <th>개수</th>
        <th>가격</th>
      </tr>
      <tr>
        <td rowspan="2">선물용</td>
        <td>3kg</td>
        <td>11~16과</td>
        <td>35,000원</td>
      </tr>
      <tr>
        <td>5kg</td>
        <td>18과~26과</td>
        <td>25,000원</td>
      </tr>
      <tr>
        <td rowspan="2">가정용</td>
        <td>3kg</td>
        <td>11과~16과</td>
        <td>30,000원</td>
      </tr>
      <tr>
        <td>5kg</td>
        <td>18과~26과</td>
        <td>47,000원</td>
      </tr>
    </table>
  </div>
</body>

</html>

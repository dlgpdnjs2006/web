<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>순서가 없는 목록</title>
  <style>
    ul{
      list-style: decimal; /* 숫자로 보이게 값 바꿈*/
    }
    ol{
      list-style: disc;  /* 순서 없이 바꿈 */
    }
  </style>
</head>
<body>
  <!-- 순서 안보이게 -->
  <ul> 
    <!-- li + tab : <li>태그 생성 -->
    <li>멜론</li>
    <li>복숭아</li>
    <li>애플망고</li>
    <li>두리안</li>
  </ul>

  <!-- 순서(숫자로) 보이게 -->
  <ol>
    <!-- li * 4 + tab : <li>태그 4개 생성 -->
    <li>맬론</li>
    <li>복숭아</li>
    <li>애플망고</li>
    <li>두리안</li>
  </ol>
</body>
</html>

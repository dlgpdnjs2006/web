<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나머지 연산</title>
</head>
<body>
  <script>
    let evenOdd = prompt('숫자를 입력하세요'); /* 값을 문자로 설정  */
    evenOdd = Number(evenOdd); /* 문자로 설정한 값을 숫자값으로 변경 */
    let comment;
    if(evenOdd % 2 === 0){
      comment = evenOdd + '는(은) 짝수 입니다';
    }else{
      comment = evenOdd + '는(은) 홀수 입니다';
    }
    document.write(comment);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 뒤집기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    .con{
      width: 300px;
      height: 300px;
      background: #ccc;
      position: relative;
      margin: 400px auto;
    }
    .con .card{
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      transition: .6s;
      transform-origin: top center;
      transform-style: preserve-3d;
    }
    .con:hover .card{
      transform: rotateX(180deg);
    }
    .face{
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
    }
    .face img{
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .back{
      transform: rotateX(180deg);
      backface-visibility: hidden;
    }
  </style>
</head>

<body>
  <div class="con">
    <div class="card">
      <div class="face front"><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbGb6Fz-1MTEOSB2g4uj7Yss5t8qI0RhdHFkETWAVArg&s=10"
          alt="앞면"></div>
      <div class="face back"><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmB9SHSnYOiryYm8PU9V5LU_GqFbNaym1LtyPnikRokg&s=10"
          alt="뒷면"></div>
    </div><!-- //.card -->
  </div><!-- //.con -->
</body>

</html>

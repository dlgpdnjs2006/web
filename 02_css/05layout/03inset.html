<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>inset 단축 속성</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    dl{
      background: rgba(0, 0, 255, .3);
      position: absolute;
      inset-inline: 10px;
      /* 양쪽 끝 기준으로 10px 안쪽으로 너비 설정(width 값이 없을때) */
      inset-block: 50px;
      /* 상하 끝 기준으로 50px 안쪽으로 너비 설정(width 값이 없을때) */
    }
    .overlay1{
      position: fixed;
      background: rgba(255, 23, 55, 0.5);
      inset: 0;
      /* 브라우저 너비 만큼 너비 설정(width 값이 없을때) */
    }
    .overlay2{
      width: 500px;
      height: 500px;
      background: rgba(0, 255, 0, 0.3);
      position: absolute;
      inset-block-start: 1rem;
      /* 아래로 1rem 이동(width 값이 있을때) */
      inset-inline-start: 2rem;
      /* 오른쪽으로 2rem 이동(width 값이 있을때) */
      left: 100px;
    }
    .overlay3{
      background: rgba(255, 0, 0, 0.3);
      position: absolute;
      inset: 0;
      inset: 10rem 5rem;
    }
    .wrap{
      background: rgba(255, 255, 0, 0.3);
      border: 1px solid red;
      position: absolute;
      inset: 25vh 10%;
      /* width:auto 이면 좌우 간격을 제외한 너비 */
      /* height:auto 이면 상하 간격을 제외한 높이 */
    }
    .box{
      width: 200px;
      height: 200px;
      background: green;
      position: absolute;
      inset: 0;
      margin: auto;
    }
  </style>
</head>
<body>
  <dl>
    <dt>inset 단축속성</dt>
    <dd>top,right,bottom,left를 한번에 지정합니다</dd>
  </dl>
  <div class="overlay1"></div>
  <div class="overlay2"></div>
  <div class="overlay3"></div>
  <div class="wrap">
    <div class="box">item</div>
  </div>
</body>
</html>

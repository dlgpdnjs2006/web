<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css 포지셔닝</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    #wrap{
      width: 300px;
      height: 300px;
      border: 1px solid #333;
      margin: 0 auto;
      position: relative; /* 기준점 설정 */
    }
    .box{
      width: 50px;
      height: 50px;
      background: rgba(255, 0, 255, .8);
      text-align: center;
      line-height: 50px;
      border-radius: 50%;
      position: absolute;
    }
    .box1{
      right: 0;
      bottom: 0;
    }
    .box2{
      right: 0;
      top: 0;
    }
    .box3{
      bottom: 0;
      left: 0;
    }
    .box4{
      top: calc(50% - 25px);
      left: calc(50% - 25px);
      /* 
      방법1
       left: 125px;
       top: 125px;
      */
      /* 
      방법2
       left: 50%;
       top: 50%;
       margintop: -25px;
       marginleft: -25px;
      */
      /*
      방법3
       transform: translate(-50%, -50%); 
      */
    }
    .box5{
      top: 50px;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="box box1">박스1</div>
    <div class="box box2">박스2</div>
    <div class="box box3">박스3</div>
    <div class="box box4">박스4</div>
    <div class="box box5">박스5</div>
  </div>
</body>
</html>

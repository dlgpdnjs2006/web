<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>float</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    div {
      width: 100px;
      height: 100px;
      border: 1px solid #ccc;
      margin: 10px;
      background: pink;
    }

    .box1 {
      float: left;
    }

    .box2 {
      float: left;
    }

    .box3 {
      float: right;
    }

    .box4 {
      float: right;
    }

    .box5 {
      clear: both;
      /* 방법1 : 동급인 마지막 자식박스에 적용 */
      float: right;
    }

    .box6 {
      float: right;
    }

    .box7 {
      clear: right;
      float: left;
    }

    .box8 {
      float: left;
    }

    .box9 {
      float: right;
    }

    .box10 {
      float: right;
    }
  </style>
</head>

<body>
  <div class="box1">박스1</div>
  <div class="box2">박스2</div>
  <div class="box3">박스3</div>
  <div class="box4">박스4</div>
  <div class="box5">박스5</div>
  <div class="box6">박스6</div>
  <div class="box7">박스7</div>
  <div class="box8">박스8</div>
  <div class="box9">박스9</div>
  <div class="box10">박스10</div>
</body>

</html>

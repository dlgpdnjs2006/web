<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그라데이션 배경</title>
  <style>
    div {
      width: 500px;
      height: 500px;
      margin: 10px;
    }

    .gr1 {
      background: linear-gradient(135deg, #ff8a1e 0%, #ffe2a6 100%);
    }

    .gr2 {
      background: radial-gradient(circle at 50% 50%, #ff8a1e 0%, #ffe2a6 100%);
    }

    .gr3 {
      background-color: #ffe2a6;
      background-image:
        radial-gradient(circle at 50% 50%, #ff8a1e 0% 18%, transparent 34%),
        radial-gradient(circle at 82% 18%, color-mix(in oklch, #ff8a1e 48%, white) 0 16%, transparent 32%),
        radial-gradient(circle at 72% 76%, #ffe2a6 0 18%, transparent 36%),
        radial-gradient(circle at 24% 82%, color-mix(in oklch, #ffe2a6 55%, black) 0 16%, transparent 34%);
      background-blend-mode: screen, normal, multiply, normal;
    }

    .gr4 {
      background-color: #ffe2a6;
      background-image:
        linear-gradient(135deg, rgba(255, 255, 255, .62), transparent 22%, rgba(255, 255, 255, .18) 42%, transparent 68%),
        radial-gradient(circle at 16% 20%, color-mix(in oklch, #ff8a1e 82%, white) 0 16%, transparent 36%),
        conic-gradient(from 135deg at 62% 46%, #ff8a1e, color-mix(in oklch, #ff8a1e 40%, #ffe2a6), #ffe2a6, color-mix(in oklch, #ffe2a6 42%, white), #ff8a1e);
      background-blend-mode: screen, lighten, normal;
    }

    .gr5 {
      background-color: #ffe2a6;
      background-image:
        linear-gradient(135deg, transparent 0 18%, rgba(255, 255, 255, .62) 24%, transparent 34%, rgba(255, 255, 255, .22) 52%, transparent 66%),
        radial-gradient(ellipse at 18% 22%, color-mix(in oklch, #ff8a1e 76%, white) 0 12%, transparent 42%),
        linear-gradient(167deg, color-mix(in oklch, #ffe2a6 86%, black), #ff8a1e 42%, color-mix(in oklch, #ffe2a6 66%, white));
      background-blend-mode: screen, lighten, normal;
    }

    .gr6 {
      background-color: #ffe2a6;
      background-image:
        repeating-radial-gradient(ellipse at 18% 26%, transparent 0 20px, color-mix(in oklch, #ff8a1e 28%, transparent) 21px 22px, transparent 23px 40px),
        repeating-radial-gradient(ellipse at 82% 72%, transparent 0 24px, color-mix(in oklch, #22d3ee 24%, transparent) 25px 26px, transparent 27px 46px),
        radial-gradient(circle at 18% 24%, #ff8a1e 0 16%, transparent 46%),
        radial-gradient(circle at 82% 18%, #22d3ee 0 18%, transparent 48%),
        radial-gradient(circle, rgba(255, 255, 255, .16) 0 1px, transparent 1px),
        linear-gradient(135deg, color-mix(in oklch, #ffe2a6 84%, black), color-mix(in oklch, #ff8a1e 20%, #ffe2a6));
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 10px 10px, 100% 100%;
      background-blend-mode: multiply, overlay, screen, lighten, soft-light, normal;
    }
  </style>
</head>

<body>
  <div class="gr1"></div>
  <div class="gr2"></div>
  <div class="gr3"></div>
  <div class="gr4"></div>
  <div class="gr5"></div>
  <div class="gr6"></div>
</body>

</html>

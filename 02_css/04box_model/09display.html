<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    div{
      margin: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    img{
      width: 300px;
    }
    #inline img:nth-child(2){
      visibility: hidden;
      /* 영역은 유지하면서 안보이게 */
    }
    #block img{
      display: block;
    }
    #block img:nth-child(2){
      display: none;
      /* 영역까지 안보이게 */
    }

    ul{
      width: 500px;
      margin: 0 auto;
      background: #ccc;
    }
    li{
      width: 100px;
      background: khaki;
      display: inline-block;
    }
    a{
      color: inherit;
      text-decoration: none;
      background: lightcoral;
    }
  </style>
</head>

<body>
  <div id="inline">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4AJDBuDAH_qDVZc1EUaYtfN3svoNBUoGmzutjOo-R2g&s=10"
      alt="차은우">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4AJDBuDAH_qDVZc1EUaYtfN3svoNBUoGmzutjOo-R2g&s=10"
      alt="차은우">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4AJDBuDAH_qDVZc1EUaYtfN3svoNBUoGmzutjOo-R2g&s=10"
      alt="차은우">
  </div>
  <div id="block">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4AJDBuDAH_qDVZc1EUaYtfN3svoNBUoGmzutjOo-R2g&s=10"
      alt="차은우">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4AJDBuDAH_qDVZc1EUaYtfN3svoNBUoGmzutjOo-R2g&s=10"
      alt="차은우">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4AJDBuDAH_qDVZc1EUaYtfN3svoNBUoGmzutjOo-R2g&s=10"
      alt="차은우">
  </div>

  <nav>
    <ul>
      <li><a href="">메뉴1</a></li>
      <li><a href="">메뉴2</a></li>
      <li><a href="">메뉴3</a></li>
      <li><a href="">메뉴4</a></li>
    </ul>
  </nav>
</body>

</html>

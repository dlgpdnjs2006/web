<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container{
      flex-wrap: wrap;
      display: flex;
      width: 1360px;
      margin: 0 auto;
    }
    .flex_item{
      flex: 1 1 auto;
    }
    /* 자식박스들이 남은 10%너비를 나눠 가짐 */
    .flex_item:nth-child(1){
      width: 30%;
    }
    .flex_item:nth-child(2){
      width: 60%;
    }
    .flex_item:nth-child(3){
      width: 20%;
    }
  </style>
</head>
<body>
  <div class="flex_container">
    <div class="flex_item">
      <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Placeat, neque? Optio explicabo repellendus aut rerum natus at necessitatibus. Facere quod numquam inventore tempore adipisci molestiae veniam saepe sint accusantium itaque!</p>
    </div>
    <div class="flex_item">BBB</div>
    <div class="flex_item">CCCCCCCCCCC</div>
  </div>
</body>
</html>
